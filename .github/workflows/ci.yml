name: Backend API Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./01-book-api-v2
        run: npm install

      - name: Start server
        working-directory: ./01-book-api-v2
        run: node server.js &

      - name: Wait for server
        run: sleep 5

      - name: Test home endpoint
        run: curl -f http://localhost:3000/

      - name: Success message
        run: echo "API tests passed 🚀"
